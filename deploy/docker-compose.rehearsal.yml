services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must match the production major}
    environment:
      POSTGRES_USER: wave0
      POSTGRES_PASSWORD: ${REHEARSAL_PASSWORD:?REHEARSAL_PASSWORD is required}
      POSTGRES_DB: wave0_rehearsal
    volumes:
      - rehearsal_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${REHEARSAL_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave0 -d wave0_rehearsal"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [rehearsal_only]

networks:
  rehearsal_only:
    internal: true

volumes:
  rehearsal_data:
